[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hteb"
version = "1.1"
description = "HTEB transformation generation and evaluation runner"
requires-python = ">=3.10,<3.11"
dependencies = [
  "accelerate==1.12.0",
  "datasets==4.6.1",
  "huggingface-hub==1.5.0",
  "numpy==2.2.6",
  "peft==0.18.1",
  "pyarrow==23.0.1",
  "pydantic==2.13.1",
  "python-dotenv==1.2.3",
  "pytrec-eval-terrier==0.5.10",
  "pyyaml==6.0.3",
  "rich==15.0.0",
  "scikit-learn==1.7.2",
  "scipy==1.15.3",
  "sentence-transformers==5.6.1",
  "torch==2.11.0",
  "tqdm==4.67.3",
  "transformers==5.14.1",
  "typing-extensions==4.16.0",
  "vllm==0.24.0",
]

[project.scripts]
hteb = "hteb.cli:main"

[tool.setuptools]
packages = ["hteb"]
include-package-data = false

[tool.setuptools.package-data]
hteb = ["dataset_metadata/groups.json"]

[tool.pytest.ini_options]
testpaths = ["hteb"]
norecursedirs = [".*", "archive", "build", "dist", "*.egg", "venv"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
